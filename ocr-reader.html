<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>책 읽어주는 돋보기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tesseract.js for OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700&display=swap');
        
        body {
            font-family: 'Nanum Gothic', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
            overscroll-behavior-y: none; /* 모바일에서 당겨서 새로고침 방지 */
        }
        
        .title-font {
            font-family: 'Jua', sans-serif;
        }

        /* 비디오 영역 가이드라인 애니메이션 */
        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: rgba(34, 197, 94, 0.8); /* green-500 */
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
            animation: scan 2s infinite linear;
            display: none;
        }
        .is-scanning .scan-line {
            display: block;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex justify-center bg-gray-900">

    <!-- 모바일 화면에 맞춘 메인 컨테이너 -->
    <div class="w-full max-w-md h-full bg-yellow-50 flex flex-col relative shadow-2xl">
        
        <!-- 상단 헤더 -->
        <header class="bg-yellow-400 text-yellow-900 p-4 flex items-center justify-between shadow-md z-10">
            <h1 class="text-2xl title-font flex items-center gap-2">
                <i class="fa-solid fa-magnifying-glass"></i> 읽어주는 돋보기
            </h1>
            <button id="settingsBtn" class="p-2 rounded-full hover:bg-yellow-500 transition">
                <i class="fa-solid fa-gear text-xl"></i>
            </button>
        </header>

        <!-- 카메라 뷰포트 영역 -->
        <div class="relative w-full flex-grow bg-black overflow-hidden flex items-center justify-center">
            <video id="cameraStream" class="min-w-full min-h-full object-cover" autoplay playsinline></video>
            
            <!-- 캡처 효과용 캔버스 (숨김) -->
            <canvas id="captureCanvas" class="hidden"></canvas>
            
            <!-- 스캔 애니메이션 라인 -->
            <div class="scan-line z-20"></div>

            <!-- 타겟팅 가이드 박스 -->
            <div class="absolute inset-0 pointer-events-none flex items-center justify-center p-6">
                <div class="w-full h-48 border-4 border-yellow-400/50 rounded-2xl relative">
                    <div class="absolute -top-1 -left-1 w-6 h-6 border-t-4 border-l-4 border-yellow-400 rounded-tl-lg"></div>
                    <div class="absolute -top-1 -right-1 w-6 h-6 border-t-4 border-r-4 border-yellow-400 rounded-tr-lg"></div>
                    <div class="absolute -bottom-1 -left-1 w-6 h-6 border-b-4 border-l-4 border-yellow-400 rounded-bl-lg"></div>
                    <div class="absolute -bottom-1 -right-1 w-6 h-6 border-b-4 border-r-4 border-yellow-400 rounded-br-lg"></div>
                </div>
            </div>
            
            <!-- 로딩 오버레이 -->
            <div id="loadingOverlay" class="absolute inset-0 bg-black/70 z-30 flex flex-col items-center justify-center hidden">
                <i class="fa-solid fa-spinner fa-spin text-5xl text-yellow-400 mb-4"></i>
                <p id="loadingText" class="text-white text-lg font-bold title-font">글자를 읽는 중이에요...</p>
                <div class="w-2/3 bg-gray-700 rounded-full h-2.5 mt-4">
                    <div id="progressBar" class="bg-yellow-400 h-2.5 rounded-full" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- 하단 컨트롤 & 결과 영역 -->
        <div class="bg-white rounded-t-3xl -mt-6 z-20 shadow-[0_-10px_20px_rgba(0,0,0,0.1)] flex flex-col h-2/5 p-5">
            
            <!-- 모드 선택 -->
            <div class="flex justify-between items-center mb-4">
                <select id="readMode" class="bg-yellow-100 text-yellow-800 font-bold py-2 px-3 rounded-xl border border-yellow-300 focus:outline-none focus:ring-2 focus:ring-yellow-400 w-full">
                    <option value="kor">🇰🇷 한글 동화책 읽기</option>
                    <option value="eng">🇺🇸 영어 문장 읽기</option>
                    <option value="eng-to-kor">🔄 영어를 한글로 번역해서 읽기</option>
                </select>
            </div>

            <!-- 인식된 텍스트 표시 영역 -->
            <div class="flex-grow overflow-y-auto bg-gray-50 rounded-xl p-4 border border-gray-200 mb-4">
                <p id="resultText" class="text-gray-500 text-center italic mt-4">
                    카메라로 책을 비추고<br>아래 버튼을 눌러주세요!
                </p>
            </div>

            <!-- 조작 버튼 -->
            <div class="flex gap-3 justify-center">
                <button id="stopBtn" class="hidden bg-red-100 text-red-600 font-bold py-3 px-4 rounded-2xl flex-1 flex justify-center items-center gap-2 active:bg-red-200 transition">
                    <i class="fa-solid fa-stop"></i> 멈추기
                </button>
                <button id="captureBtn" class="bg-yellow-400 text-yellow-900 font-bold py-4 px-6 rounded-2xl w-full text-lg shadow-[0_4px_0_#ca8a04] active:shadow-none active:translate-y-1 transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-camera"></i> 사진 찍고 읽기
                </button>
            </div>
        </div>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        const video = document.getElementById('cameraStream');
        const canvas = document.getElementById('captureCanvas');
        const captureBtn = document.getElementById('captureBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resultText = document.getElementById('resultText');
        const readMode = document.getElementById('readMode');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const progressBar = document.getElementById('progressBar');
        
        let currentStream = null;
        let isReading = false;
        const synth = window.speechSynthesis;

        // 1. 카메라 초기화 (해상도 및 오토포커스 최적화)
        async function initCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                const constraints = {
                    video: { 
                        facingMode: "environment", // 후면 카메라 우선
                        width: { ideal: 1920 }, // 텍스트 인식을 위해 높은 해상도 요청
                        height: { ideal: 1080 },
                        advanced: [{ focusMode: "continuous" }] // 가능한 경우 자동 초점 유지
                    }
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
            } catch (err) {
                console.error("Camera access error:", err);
                resultText.innerHTML = `<span class="text-red-500"><i class="fa-solid fa-triangle-exclamation"></i> 카메라 권한을 허용해주세요.</span>`;
            }
        }

        // 2. 음성 합성 (TTS) 설정 모바일 대응
        function unlockAudio() {
            const utterance = new SpeechSynthesisUtterance('');
            synth.speak(utterance);
        }

        // 3. 텍스트 읽어주기 (TTS)
        function speakText(text, langCode) {
            if (synth.speaking) synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langCode;
            utterance.rate = 0.9;
            utterance.pitch = 1.1;

            utterance.onstart = () => {
                isReading = true;
                captureBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');
            };

            utterance.onend = () => {
                isReading = false;
                captureBtn.classList.remove('hidden');
                stopBtn.classList.add('hidden');
            };

            utterance.onerror = (e) => {
                console.error('TTS Error:', e);
                isReading = false;
                captureBtn.classList.remove('hidden');
                stopBtn.classList.add('hidden');
            };

            synth.speak(utterance);
        }

        // 4. 영한 번역 (무료 공개 API 사용: MyMemory)
        async function translateText(text) {
            try {
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ko`);
                const data = await response.json();
                if (data && data.responseData && data.responseData.translatedText) {
                    return data.responseData.translatedText;
                }
                return "번역 서버에 연결하지 못했어요.";
            } catch (error) {
                console.error("Translation error:", error);
                return "번역 중 오류가 발생했어요.";
            }
        }

        // 5. 메인 로직: 사진 촬영 -> 이미지 전처리 -> OCR -> 번역(선택) -> TTS
        captureBtn.addEventListener('click', async () => {
            unlockAudio();

            // 비디오 프레임을 캔버스에 그리기
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // [개선] OCR 인식률 향상을 위한 이미지 전처리 필터 적용
            // 흑백 처리, 대비(Contrast) 증가, 밝기(Brightness) 조절로 글자를 선명하게 만듦
            ctx.filter = 'grayscale(100%) contrast(150%) brightness(120%)';
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // 용량 최적화 및 텍스트 선명도 유지를 위해 고품질 JPEG 사용
            const imageData = canvas.toDataURL('image/jpeg', 0.9);

            // UI 상태 변경
            document.querySelector('.relative').classList.add('is-scanning');
            loadingOverlay.classList.remove('hidden');
            resultText.innerHTML = `<span class="text-gray-400">글자를 분석하고 있어요...</span>`;
            progressBar.style.width = '0%';

            const mode = readMode.value;
            // [개선] 한글 모드일 때 영어 단어가 섞여 있어도 깨지지 않도록 'kor+eng' 사용
            const tesseractLang = (mode === 'kor') ? 'kor+eng' : 'eng';
            
            try {
                // Tesseract OCR 실행
                const { data: { text } } = await Tesseract.recognize(
                    imageData,
                    tesseractLang,
                    {
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                const progress = Math.round(m.progress * 100);
                                progressBar.style.width = `${progress}%`;
                                loadingText.innerText = `글자를 읽는 중이에요... ${progress}%`;
                            } else {
                                loadingText.innerText = `사전 준비 중이에요...`;
                            }
                        }
                    }
                );

                const cleanedText = text.replace(/\n/g, ' ').trim();

                if (!cleanedText) {
                    resultText.innerHTML = `<span class="text-red-500 font-bold">글자를 찾지 못했어요. 조금 더 가까이 찍어볼까요?</span>`;
                    return;
                }

                // 결과 처리
                if (mode === 'eng-to-kor') {
                    loadingText.innerText = "우리말로 번역하고 있어요...";
                    progressBar.style.width = "100%";
                    const translatedText = await translateText(cleanedText);
                    
                    resultText.innerHTML = `
                        <p class="text-xs text-gray-400 mb-2">${cleanedText}</p>
                        <p class="text-xl font-bold text-gray-800 title-font leading-relaxed">${translatedText}</p>
                    `;
                    speakText(translatedText, 'ko-KR');

                } else if (mode === 'eng') {
                    resultText.innerHTML = `<p class="text-xl font-bold text-gray-800 title-font leading-relaxed">${cleanedText}</p>`;
                    speakText(cleanedText, 'en-US');
                } else {
                    resultText.innerHTML = `<p class="text-xl font-bold text-gray-800 title-font leading-relaxed">${cleanedText}</p>`;
                    speakText(cleanedText, 'ko-KR');
                }

            } catch (err) {
                console.error(err);
                resultText.innerHTML = `<span class="text-red-500 font-bold">오류가 발생했어요. 다시 시도해주세요.</span>`;
            } finally {
                // UI 상태 복구
                document.querySelector('.relative').classList.remove('is-scanning');
                loadingOverlay.classList.add('hidden');
                loadingText.innerText = "글자를 읽는 중이에요...";
            }
        });

        // 6. 읽기 멈춤 버튼
        stopBtn.addEventListener('click', () => {
            if (synth.speaking) {
                synth.cancel();
            }
            isReading = false;
            captureBtn.classList.remove('hidden');
            stopBtn.classList.add('hidden');
        });

        // 앱 시작 시 카메라 구동
        window.addEventListener('load', initCamera);

    </script>
</body>
</html>
